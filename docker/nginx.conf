# ============================================================================
# Private Sun Yat-sen Memorial Hall — Frontend Nginx Configuration
# ============================================================================
# 1. Block-style comments only (full-line `#`).
# 2. All prose is written in English.
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    location = /admin {
        return 301 /pages/admin/;
    }

    location = /api/env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:mp3|flac|jpg|jpeg|png|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
